# Supabase free-tier projects auto-pause after 7 days with no API activity.
# This workflow runs once a week and hits the Supabase REST API just enough
# to count as "activity", keeping the project awake without costing anything.
#
# The SUPABASE_URL and SUPABASE_ANON_KEY secrets are set in:
#   GitHub repo → Settings → Secrets and variables → Actions
# Use the same values as NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY.

name: Keep Supabase alive

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: # also lets you trigger it manually from the GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase health endpoint
        run: |
          curl --fail --silent \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
          echo "Supabase pinged successfully."
